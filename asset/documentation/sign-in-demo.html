<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in — example.com</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 48px auto;
      max-width: 360px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: none;
      border-radius: 4px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Sign in</h1>
  <form>
    <label>Email
      <input type="email" name="email" placeholder="you@example.com">
    </label>
    <label>Password
      <input type="password" name="password" placeholder="••••••••">
    </label>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
